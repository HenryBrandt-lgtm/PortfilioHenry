<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortfolioHenryBrandt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="contactForm.css" />
  </head>
  <body>
    <!-- ======================navbar=========== -->
    <nav class="navbar">
      <div class="logo">Portfolio</div>
      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#hero">Hem</a></li>
        <li><a href="#contact-me">Kontakt</a></li>
        <li><a href="#about">Om mig</a></li>
        <li><a href="#">CV</a></li>
      </ul>
    </nav>
    <!-- =========================hero=============== -->
    <div class="container" id="hero">
      <div class="left">
        <div class="profile-card">
          <img
            class="profile-pic"
            src="Images/HenryKlippt.png"
            alt="PictureOfMe"
          />

          <h3>Arbetsvillig och snabblärd,</h3>
          <h3>redo för nya erfarenheter!</h3>
          <div class="buttons">
            <a href="#contact-me" class="hero-btn" id="contact">Kontakta mig</a>
            <a href="#about" class="hero-btn" id="more">Mer om mig</a>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="overlay">
          <h2 class="hero-name">Henry Brandt</h2>
          <h1 class="hero-header">.NET utvecklare med fullstack kunskaper.</h1>
        </div>
      </div>
    </div>
    <!-- ==============about================ -->
    <section id="about" style="position: relative">
      <div class="about-container">
        <img
          class="about-picture"
          id="about-tree"
          src="Images/tran.png"
          alt="TreeLine"
        />
      </div>
    </section>
    <!-- ========nästa====== -->
    <div class="next">
      <img
        class="next-pic"
        src="Images/ground.png"
        alt="picture of roots underground"
      />
    </div>

    <!-- ========contact================ -->
    <section id="contact-me">
      <div class="left-contact">
        <form
          action="https://formsubmit.co/628b994dd02f0f2e605fde5d60cd582c"
          method="POST"
        >
          <h2>Kontakta mig</h2>
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
          <textarea rows="5" name="Message" required></textarea>
          <button type="submit" id="send-email">Skicka</button>
        </form>
      </div>
      <div class="right-contact">
        <div class="card"></div>
      </div>
    </section>

    <!-- ====================footer================ -->
    <footer id="site-footer">
      <p>© 2026 Henry Brandt</p>
      <div class="footer-links">
        <a
          href="https://www.linkedin.com/in/henry-brandt-07032629a"
          target="_blank"
        >
          <img src="Images/linkedIn.svg" width="25px" />
        </a>
        <a href="#">
          <img src="Images/git.svg" width="25px" />
        </a>
        <a href="#">
          <img src="Images/mail.svg" width="25px" />
        </a>
      </div>
    </footer>
    <script src="app.js" charset="utf-8"></script>
  </body>
</html>
