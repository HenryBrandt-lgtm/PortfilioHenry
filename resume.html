<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV-Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="contactForm.css" />
  </head>
  <body>
    <!-- ======================navbar=========== -->
    <nav class="navbar">
      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Hem</a></li>
        <li><a href="   #contact-me">Kontakt</a></li>
        <li><a href="index.html#about">Om mig</a></li>
        <li><a href="resume.html">CV</a></li>
      </ul>
    </nav>
    <!-- ========resume===== -->
    <section class="resume-page">
      <div class="resume">
        <a
          href="files/CV Henry Brandt.pdf"
          download
          class="hero-btn"
          id="download"
          >Ladda ner</a
        >
        <img class="resume-img" src="Images/CV.png" alt="Henry Brandt Resume" />
      </div>
    </section>
    <!-- ==========contact========== -->
    <section id="contact-me">
      <div class="left-contact">
        <form
          action="https://formsubmit.co/628b994dd02f0f2e605fde5d60cd582c"
          method="POST"
        >
          <h2>Kontakta mig</h2>
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
          <textarea rows="5" name="Message" required></textarea>
          <button type="submit" id="send-email">Skicka</button>
        </form>
      </div>
    </section>
    <!-- ====================footer================ -->
    <footer id="site-footer">
      <p>© 2026 Henry Brandt</p>
      <div class="footer-links">
        <a
          href="https://www.linkedin.com/in/henry-brandt-07032629a"
          target="_blank"
        >
          <img src="Images/linkedIn.svg" width="25px" alt="linedIn Icon" />
        </a>
        <a href="#">
          <img src="Images/git.svg" width="25px" alt="gitHub Icon" />
        </a>
        <a href="#">
          <img src="Images/mail.svg" width="25px" alt="Mail Icon" />
        </a>
      </div>
    </footer>
    <script src="app.js" charset="utf-8"></script>
  </body>
</html>
