<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV-Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,700&family=Oregano&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="contactForm.css" />
  </head>
  <body>
    <!-- ======================navbar=========== -->
    <nav class="navbar">
      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" data-i18n="nav-home">Hem</a></li>
        <li><a href="#contact-me" data-i18n="nav-contact">Kontakt</a></li>
        <li><a href="index.html#about" data-i18n="nav-about">Om mig</a></li>
        <li>
          <a href="index.html#projects" data-i18n="nav-projects">Projekt</a>
        </li>
        <li><a href="resume.html" data-i18n="nav-cv">CV</a></li>
      </ul>
      <button id="lang-btn">EN</button>
    </nav>
    <!-- ========resume===== -->
    <section class="resume-page">
      <div class="resume">
        <div class="resume-btns">
          <a href="index.html" class="btn" id="more" data-i18n="home-btn"
            >Startsidan</a
          >
          <a
            href="files/CV Henry Brandt.pdf"
            download
            class="btn"
            id="download-btn"
            data-i18n="download-btn"
            >Ladda ner</a
          >
        </div>
        <img
          class="resume-img"
          src="Images/CV Henry Brandt-1.png"
          alt="Henry Brandt Resume"
        />
      </div>
    </section>
    <!-- ==========contact========== -->
    <section id="contact-me">
      <div class="contact-container">
        <form
          action="https://formsubmit.co/628b994dd02f0f2e605fde5d60cd582c"
          method="POST"
        >
          <h2 data-i18n="contact-header">Kontakta mig</h2>
          <input
            type="text"
            name="name"
            data-i18n-placeholder="placeholder-name"
            placeholder="Ditt Namn"
            pattern="[A-Za-zÅÄÖåäö\s]+"
            required
          />
          <input
            type="email"
            name="email"
            data-i18n-placeholder="placeholder-email"
            placeholder="Din Email"
            required
          />
          <textarea
            rows="5"
            name="Message"
            data-i18n-placeholder="placeholder-message"
            placeholder="Meddelande"
            required
          ></textarea>
          <button type="submit" id="send-email" data-i18n="send-btn">
            Skicka
          </button>
        </form>
      </div>
    </section>
    <!-- ====================footer================ -->
    <footer class="footer" id="site-footer">
      <p>© 2026 Henry Brandt</p>
      <div class="footer-links">
        <a
          href="https://www.linkedin.com/in/henry-brandt-07032629a"
          target="_blank"
        >
          <img src="Images/linkedIn.svg" width="25px" alt="linedIn Icon" />
        </a>
        <a href="https://github.com/HenryBrandt-lgtm" target="_blank">
          <img src="Images/git.svg" width="25px" alt="gitHub Icon" />
        </a>
        <a href="#contact-me">
          <img src="Images/mail.svg" width="25px" alt="Mail Icon" />
        </a>
      </div>
      <div class="weather-stuff"></div>
    </footer>
    <script src="translations.js"></script>
    <script src="app.js"></script>
  </body>
</html>
